name: Run F1 Updates Weekly

on:
  schedule:
    - cron: '0 12 * * 1'  # Runs every Monday at 12 PM UTC (which is 7 AM EST)
  workflow_dispatch:  # This allows manual triggering
    inputs:
      notebook:
        description: 'Choose notebook to run'
        required: true
        default: 'fetchf1summaries.ipynb'

jobs:
  run_notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert

      - name: Run Jupyter notebook
        run: |
          jupyter nbconvert --to notebook --execute --fetchf1summaries.ipynb
