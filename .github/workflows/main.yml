name: Run F1 Updates Weekly

on:
  schedule:
    - cron: '0 12 * * 1'  # Runs every Monday at 12 PM UTC (which is 7 AM EST)
  workflow_dispatch:  # This allows manual triggering
  
jobs:
  run_notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert tensorflow transformers tf-keras newspaper3k lxml_html_clean ipywidgets tweepy requests requests_oauthlib torch

      - name: Run F1 updates script
        run: |
          python fetchf1summaries.py
          
