name: Run F1 Updates Weekly

on:
  schedule:
    - cron: "0 12 * * 1" # Monday 12:00 UTC (~7 AM EST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_f1_updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run F1 updates script
        run: python fetchf1summaries.py

      - name: Commit and push summary JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f f1_summary_output.json ]; then
            echo "f1_summary_output.json missing (script may have skipped write); nothing to commit"
            exit 0
          fi
          git add f1_summary_output.json
          if git diff --staged --quiet; then
            echo "No changes to f1_summary_output.json"
          else
            git commit -m "chore: update F1 summary output [skip ci]"
            git push
          fi
